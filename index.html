<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack Game </title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <div class="game-det">
            <div class="details-zone">
                <h3><i class="ri-shield-star-fill"></i>Hight Score : <Span class="Hight">0</Span></h3>
            </div>

             <div class="details-zone">
                <h3><i class="ri-shield-user-fill"></i>Score : <Span class="scrore">0</Span></h3>
            </div>

             <div class="details-zone">
                <h3><i class="ri-time-fill"></i>Time : <Span class="timer">00-00</Span></h3>
            </div>
        </div>
        <div class="game-board">
          
        </div>

        <div class="WelcomeScreen">
            <h1>Snaky The First Choise Of Children</h1>
            <button class="styled-button">Start Now</button>
        </div>

         <div class="ResetScreen">
            <h1>Game Overed ! Play Again</h1>
            <button class="reset">Restart Now</button>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
